<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pixel Soccer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #222034; overflow: hidden;
    font-family: 'Press Start 2P', 'Courier New', monospace; color: #F7E26B;
    -webkit-user-select: none; user-select: none; touch-action: none; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; padding: 8px; }
  h1 { font-size: clamp(14px, 3vw, 22px); letter-spacing: 2px; text-shadow: 2px 2px 0 #1A1C2C; }
  .stage { position: relative; width: min(96vw, calc((100vh - 90px) * 4 / 3)); aspect-ratio: 4 / 3;
    border: 4px solid #F7E26B; background: #1A1C2C; box-shadow: 0 0 0 4px #1A1C2C, 8px 8px 0 rgba(0,0,0,.4); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; }
  .overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(26,28,44,.94); z-index: 5; padding: 12px; text-align: center; }
  .overlay.hidden { display: none; }
  .overlay .big { font-size: clamp(12px, 2.4vw, 18px); }
  .btn { font-family: inherit; font-size: clamp(10px, 1.8vw, 13px); padding: 10px 18px; cursor: pointer;
    background: #1A1C2C; color: #F7E26B; border: 3px solid #F7E26B; }
  .btn:hover { background: #F7E26B; color: #1A1C2C; }
  .btn.alt { color: #7fd4ff; border-color: #3B5DC9; }
  .btn.alt:hover { background: #3B5DC9; color: #fff; }
  .hint { font-size: clamp(8px, 1.4vw, 10px); line-height: 1.9; opacity: .85; max-width: 92%; }
  .hint .r { color: #ff8a8a; } .hint .b { color: #9ec1ff; }
  .footnote { font-size: clamp(7px, 1.2vw, 9px); opacity: .55; }
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="wrap">
  <h1>PIXEL SOCCER</h1>
  <div class="stage">
    <canvas id="game" width="320" height="240"></canvas>

    <div id="menu" class="overlay">
      <div class="big">CHOOSE MODE:</div>
      <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:6px;">
        <button class="btn" id="btn-vs-bot">&#9654; VS BOT</button>
        <button class="btn alt" id="btn-friends">&#128101; PLAY WITH A FRIEND</button>
      </div>
      <div style="display:flex; gap:6px; align-items:center; justify-content:center; margin-bottom:8px;">
        <input class="join-input" id="join-code-input" maxlength="6" placeholder="ROOM CODE"
          style="width:120px;text-align:center;font-size:11px;padding:6px;border:2px solid #3B5DC9;background:#1A1C2C;color:#F7E26B;font-family:inherit;">
        <button class="btn alt" id="btn-join" style="padding:6px 10px;">JOIN</button>
      </div>
      <div class="hint">VS BOT: WASD MOVE &middot; SPACE KICK<br>
        MOBILE: DRAG TO MOVE &middot; TAP TO KICK<br><br>
        MULTIPLAYER: SHARE THE LINK WITH A FRIEND
      </div>
    </div>

    <div id="fulltime" class="overlay hidden">
      <div class="big" id="ft-title">FULL TIME!</div>
      <div class="big" id="ft-score">0 - 0</div>
      <button class="btn" id="btn-rematch">&#9654; REMATCH</button>
      <button class="btn alt" id="btn-menu">MENU</button>
    </div>

    <div id="disconnect" class="overlay hidden">
      <div class="big" style="color:#ff8a8a;">OPPONENT DISCONNECTED</div>
      <div class="big" id="dc-countdown">Reconnecting in 60s...</div>
      <button class="btn alt" id="btn-dc-menu">BACK TO MENU</button>
    </div>
  </div>
  <div class="footnote">FIRST TO OUTSCORE IN 2 MINUTES WINS &middot; TREELIFE ARCADE</div>
</div>
<script src="js/game.js"></script>
</body>
</html>
